plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.anonymous.pathu'
version = '1.0.0'

// Backend Bearer secret for the native /chat client: PATHU_API_SECRET from the build environment,
// else EXPO_PUBLIC_PATHU_API_SECRET from mobile/pathu/.env (same value the RN client uses).
def pathuApiSecret = {
  def fromEnv = System.getenv("PATHU_API_SECRET")?.trim()
  if (fromEnv) return fromEnv
  def envFile = new File(projectDir, "../../../.env")
  if (!envFile.exists()) return ""
  def line = envFile.readLines().find { it.trim().startsWith("EXPO_PUBLIC_PATHU_API_SECRET=") }
  return line ? line.substring(line.indexOf('=') + 1).trim() : ""
}()

android {
  namespace "expo.modules.pathuassistant"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    buildConfigField "String", "PATHU_API_SECRET", "\"${pathuApiSecret.replace('\\', '\\\\').replace('"', '\\"')}\""
  }
  buildFeatures {
    buildConfig true
  }
}

dependencies {
  // TFLite Interpreter runtime for the pre-trained openWakeWord models; independent of sherpa's onnxruntime.
  // 1.4.x: Java Interpreter API; 2.x is built with a newer Kotlin than this Expo toolchain.
  implementation "com.google.ai.edge.litert:litert:1.4.2"
  // Native Audius playback for the assistant path (streams via the backend /music/stream redirect).
  implementation "androidx.media3:media3-exoplayer:1.11.1"
}
